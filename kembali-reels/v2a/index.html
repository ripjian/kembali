<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      /* Reel 02 · A — Orbit. The ten features ride one 3D ring that never stops moving. */
      .mask { position: absolute; left: 70px; width: 940px; text-align: center; overflow: hidden; font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; font-size: 170px; height: 190px; }
      .mask span { display: block; }
      .mask i { font-style: italic; font-weight: 400; color: #E0684B; }
      #cam { position: absolute; left: 540px; top: 1030px; width: 0; height: 0; perspective: 2400px; perspective-origin: 0 0; }
      #ring { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
      #ring .fp { left: -320px; top: -280px; backface-visibility: hidden; }
      #floor { position: absolute; left: 90px; top: 1360px; width: 900px; height: 90px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 70%); }
      .spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #E0684B; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <div id="glow"></div>

      <section id="s1" class="clip" data-start="0" data-duration="3.2" data-track-index="1">
        <div class="mask" id="h1" style="top:680px"><span>One <i>card.</i></span></div>
        <div class="mask" id="h2" style="top:870px"><span>Ten jobs.</span></div>
      </section>

      <section id="s2" class="clip" data-start="2.2" data-duration="20.1" data-track-index="2">
        <div id="floor"></div>
        <div id="sparks"></div>
        <div id="cam"><div id="ring"></div></div>
      </section>

      <section id="s9" class="clip" data-start="22.1" data-duration="2.9" data-track-index="4">
        <div id="endc"><svg viewBox="0 0 80 80"><path d="M64 40 A24 24 0 1 1 57 23" fill="none" stroke="#F6F1E3" stroke-width="6" stroke-linecap="round"/><polygon points="62.7,28.7 60.5,19.5 53.5,26.5" fill="#F6F1E3"/><circle cx="40" cy="40" r="8" fill="#E0684B"/></svg><p class="word"><span>k</span><span>e</span><span>m</span><span>b</span><span>a</span><span>l</span><span class="i">i</span></p><p class="tagl">Loyalty your customers will love.</p><p class="line"></p></div>
      </section>

      <section id="ui" class="clip" data-start="0" data-duration="25" data-track-index="3">
        <p class="tag"></p>
        <p class="cap" data-layout-allow-overlap></p><p class="cap" data-layout-allow-overlap></p>
        <p class="sub" data-layout-allow-overlap></p><p class="sub" data-layout-allow-overlap></p>
        <div id="iris"></div>
      </section>

      <audio id="music" data-start="0" data-duration="25" data-track-index="10" data-volume="0.34" data-fade-in="0.3" data-fade-out="1.6" src="assets/music/track.mp3"></audio>
      <audio id="w1" data-start="2.45" data-duration="0.8" data-track-index="11" data-volume="0.5" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="end" data-start="22.2" data-duration="1.4" data-track-index="12" data-volume="0.55" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/features.js"></script>
    <script>
      const { b, rnd } = K;
      const tl = gsap.timeline({ paused: true });
      const M = K.motion(tl);
      const R = 1060, STEP = 36;

      /* build the ring */
      const ring = document.getElementById("ring");
      FEAT.build("a").forEach((html, k) => { ring.insertAdjacentHTML("beforeend", html); });
      for (let k = 0; k < 10; k++) document.getElementById(`aP${k}`).style.transform = `rotateY(${k * STEP}deg) translateZ(${R}px)`;
      FEAT.prep(tl, "a");
      FEAT.allowOverlap("#ring .fp");
      // ambient sparks drifting in depth
      const sp = document.getElementById("sparks");
      for (let i = 0; i < 18; i++) { const d = document.createElement("div"); d.className = "spark"; d.style.left = `${80 + rnd() * 920}px`; d.style.top = `${620 + rnd() * 900}px`; if (i % 3 === 0) d.style.background = "#F6F1E3"; sp.appendChild(d); tl.fromTo(d, { opacity: 0, y: 0, scale: 0.4 + rnd() }, { opacity: 0.45, y: -120 - rnd() * 160, duration: 20, ease: "none", immediateRender: false }, 2.2); }

      /* sound on each turn */
      const root = document.getElementById("root");
      const addSfx = (id, t, src, vol, track) => root.insertAdjacentHTML("beforeend", `<audio id="${id}" data-start="${t.toFixed(3)}" data-duration="0.4" data-track-index="${track}" data-volume="${vol}" src="${src}"></audio>`);

      M.tag("KEMBALI · 02 / 03", 0.1);

      /* Hook: masked title */
      tl.fromTo("#h1 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(0));
      tl.fromTo("#h2 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(1));
      tl.to(["#h1 span", "#h2 span"], { yPercent: -105, duration: 0.45, ease: "power3.in", stagger: 0.07 }, b(3) + 0.1);

      /* The ring spins in from deep space and lands on 01 */
      tl.set("#ring", { z: -R - 2600, rotationY: 400, rotationX: -8, opacity: 0 }, 0);
      tl.to("#ring", { opacity: 1, duration: 0.4 }, 2.25);
      tl.to("#ring", { z: -R + 220, rotationY: 0, rotationX: -4, duration: 1.6, ease: "power3.out" }, 2.25);
      tl.fromTo("#floor", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 1.2, ease: "power3.out", immediateRender: false }, 2.4);

      // dim everything except the panel facing the camera; crossfades overlap the turn
      for (let k = 1; k < 10; k++) tl.set(`#aP${k}`, { opacity: 0.5 }, 0);
      const F = (k) => b(6 + k * 3);
      for (let k = 0; k < 10; k++) {
        const t = F(k);
        if (k > 0) {
          tl.to("#ring", { rotationY: -STEP * k, duration: 0.8, ease: "power3.inOut" }, t - 0.55);
          tl.to(`#aP${k - 1}`, { opacity: 0.5, duration: 0.6, ease: "power1.inOut" }, t - 0.5);
          tl.to(`#aP${k}`, { opacity: 1, duration: 0.6, ease: "power1.inOut" }, t - 0.5);
          // a gentle bob on arrival keeps the ring feeling physical
          tl.to("#ring", { rotationX: -6, duration: 0.25, ease: "power2.out" }, t + 0.2).to("#ring", { rotationX: -4, duration: 0.5, ease: "power2.inOut" }, t + 0.45);
          addSfx(`t${k}`, t - 0.2, "assets/sfx/interface/click_003.ogg", 0.4, 11 + (k % 2));
        }
        M.say(FEAT.CAPS[k][0], t - 0.25);
        M.note(FEAT.CAPS[k][1], t - 0.15);
        FEAT.play(tl, "a", k, t + 0.15);
      }

      /* Finale: the camera pulls back and the ring keeps turning, all ten on show */
      const FIN = F(10);
      tl.to(`#aP9`, { opacity: 0.85, duration: 0.4 }, FIN - 0.4);
      for (let k = 0; k < 9; k++) tl.to(`#aP${k}`, { opacity: 0.85, duration: 0.6 }, FIN - 0.4);
      tl.to("#ring", { z: -R - 1900, rotationX: -18, duration: 1.2, ease: "power3.inOut" }, FIN - 0.5);
      tl.to("#ring", { rotationY: -STEP * 9 - 200, duration: 3.2, ease: "power1.inOut" }, FIN - 0.5);
      tl.to("#floor", { scaleX: 0.6, opacity: 0.6, duration: 1.2 }, FIN - 0.5);
      M.say("One card. <i>Ten jobs.</i>", FIN);
      M.note("On the phones you and your customers already have.", FIN + 0.1);

      M.iris(21.8, (t) => { tl.set(["#ring", "#floor", "#sparks"], { opacity: 0 }, t); M.clear(t - 0.05); tl.set(".tag", { opacity: 0 }, t); });
      M.end(22.2, "ONE CARD · TEN JOBS");

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
