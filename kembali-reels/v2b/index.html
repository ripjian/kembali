<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      /* Reel 02 · B — Journey. One unbroken camera glide down a coral path,
         past the shops it is made for. Panels tilt up as they arrive and lie
         back as they pass (2.5D); photos drift slower behind (parallax). */
      .mask { position: absolute; left: 70px; width: 940px; text-align: center; overflow: hidden; font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; font-size: 170px; height: 190px; }
      .mask span { display: block; }
      .mask i { font-style: italic; font-weight: 400; color: #E0684B; }
      #view { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1700px; perspective-origin: 540px 900px; overflow: hidden; }
      #bgw, #world { position: absolute; left: 0; top: 0; width: 1080px; height: 9000px; transform-style: preserve-3d; }
      #world .fp { left: 220px; transform-origin: 50% 50%; }
      .pol { position: absolute; width: 380px; padding: 14px 14px 46px; background: #F6F1E3; border-radius: 10px; box-shadow: 0 30px 70px rgba(0,0,0,0.4); }
      .pol img { display: block; width: 352px; height: 280px; object-fit: cover; border-radius: 4px; }
      .pol b { position: absolute; left: 18px; bottom: 12px; font-family: "PlexMono", monospace; font-size: 17px; letter-spacing: 0.18em; color: #16261E; font-weight: 500; }
      #pathsvg { position: absolute; left: 0; top: 0; width: 1080px; height: 9000px; overflow: visible; }
      #veil { position: absolute; left: 0; top: 0; width: 1080px; height: 610px; background: linear-gradient(180deg, #0F3D32 0%, #0F3D32 84%, rgba(15,61,50,0) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">
      <div id="glow"></div>

      <section id="s2" class="clip" data-start="0" data-duration="22.2" data-track-index="1">
        <div id="view">
          <div id="bgw"></div>
          <div id="world"><svg id="pathsvg" viewBox="0 0 1080 9000"><path id="road" fill="none" stroke="#E0684B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle id="head" r="16" fill="#E0684B"/></svg></div>
        </div>
        <div id="veil" data-layout-allow-occlusion></div>
        <div class="mask" id="h1" style="top:640px"><span>One <i>card.</i></span></div>
        <div class="mask" id="h2" style="top:830px"><span>Ten jobs.</span></div>
      </section>

      <section id="s9" class="clip" data-start="22.1" data-duration="2.9" data-track-index="4">
        <div id="endc"><svg viewBox="0 0 80 80"><path d="M64 40 A24 24 0 1 1 57 23" fill="none" stroke="#F6F1E3" stroke-width="6" stroke-linecap="round"/><polygon points="62.7,28.7 60.5,19.5 53.5,26.5" fill="#F6F1E3"/><circle cx="40" cy="40" r="8" fill="#E0684B"/></svg><p class="word"><span>k</span><span>e</span><span>m</span><span>b</span><span>a</span><span>l</span><span class="i">i</span></p><p class="tagl">Loyalty your customers will love.</p><p class="line"></p></div>
      </section>

      <section id="ui" class="clip" data-start="0" data-duration="25" data-track-index="3">
        <p class="tag"></p>
        <p class="cap" data-layout-allow-overlap></p><p class="cap" data-layout-allow-overlap></p>
        <p class="sub" data-layout-allow-overlap></p><p class="sub" data-layout-allow-overlap></p>
        <div id="iris"></div>
      </section>

      <audio id="music" data-start="0" data-duration="25" data-track-index="10" data-volume="0.34" data-fade-in="0.3" data-fade-out="1.6" src="assets/music/track.mp3"></audio>
      <audio id="end" data-start="22.2" data-duration="1.4" data-track-index="12" data-volume="0.55" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/features.js"></script>
    <script>
      const { b } = K;
      const tl = gsap.timeline({ paused: true });
      const M = K.motion(tl);
      const GAP = 800, TOP = 600; // panel k occupies world y TOP+GAP*k … +560
      const cy = (k) => TOP + GAP * k + 280; // panel centre (world)

      /* panels */
      const world = document.getElementById("world");
      FEAT.build("b").forEach((html, k) => { world.insertAdjacentHTML("beforeend", html); document.getElementById(`bP${k}`).style.top = `${TOP + GAP * k}px`; });
      FEAT.prep(tl, "b");
      FEAT.allowOverlap("#world .fp");

      /* parallax photos (world y is scrolled at 0.55× the camera) */
      const PHOTOS = [["ind-cafe", "CAFÉ"], ["food-croissant", "BAKERY"], ["ind-salon", "SALON"], ["food-coffee", "KOPITIAM"], ["ind-carwash", "CAR WASH"], ["ind-dessert", "DESSERT BAR"], ["ind-restaurant", "RESTAURANT"], ["scene-shophouse", "SHOPHOUSE"], ["story-serve", "COUNTER"], ["scene-corner", "CORNER CAFÉ"]];
      const bgw = document.getElementById("bgw");
      PHOTOS.forEach(([f, label], j) => {
        const left = j % 2 ? 700 : -40, top = 1250 + j * 470, rot = j % 2 ? 6 : -7;
        bgw.insertAdjacentHTML("beforeend", `<div class="pol" id="ph${j}" style="left:${left}px;top:${top}px;transform:rotate(${rot}deg)"><img src="assets/img/${f}.jpg" alt=""/><b data-layout-allow-occlusion>${label}</b></div>`);
      });

      /* the road: hugs alternate sides of each panel and crosses in the gaps */
      let d = `M 540 ${TOP - 120}`;
      for (let k = 0; k < 10; k++) {
        const x = k % 2 ? 960 : 120, nx = k % 2 ? 120 : 960, y0 = TOP + GAP * k, y1 = y0 + 560;
        d += ` C ${k === 0 ? 540 : x} ${y0 - 60}, ${x} ${y0 - 20}, ${x} ${y0 + 40} L ${x} ${y1 - 40}`;
        if (k < 9) d += ` C ${x} ${y1 + 160}, ${nx} ${y1 + 80}, ${nx} ${y1 + 240}`;
      }
      const road = document.getElementById("road"); road.setAttribute("d", d);
      const L = road.getTotalLength();
      // length at the end of each panel's side run, found by scanning the path
      const stopLen = [];
      { let k = 0; for (let s = 0; s <= L && k < 10; s += 4) { const pt = road.getPointAtLength(s); if (pt.y >= TOP + GAP * k + 520) { stopLen.push(s); k++; } } while (stopLen.length < 10) stopLen.push(L); }
      tl.set("#road", { strokeDasharray: L, strokeDashoffset: L }, 0);
      const headAt = (s) => { const p = road.getPointAtLength(s); return { attr: { cx: p.x, cy: p.y } }; };
      tl.set("#head", headAt(0), 0);
      let drawn = 0;
      const drawTo = (s, t, dur) => { const steps = 8; for (let i = 1; i <= steps; i++) tl.to("#head", { ...headAt(drawn + (s - drawn) * i / steps), duration: dur / steps, ease: "none" }, t + (i - 1) * dur / steps); tl.to("#road", { strokeDashoffset: L - s, duration: dur, ease: "none" }, t); drawn = s; };

      /* camera: world y offset so panel k's centre sits at screen y 880 */
      const camY = (k) => 880 - cy(k);
      tl.set("#world", { y: camY(0) + 1100 }, 0);
      tl.set("#bgw", { y: (camY(0) + 1100) * 0.55 }, 0);
      for (let k = 0; k < 10; k++) tl.set(`#bP${k}`, { rotationX: 32, scale: 0.9, opacity: 0.75 }, 0);

      M.tag("KEMBALI · 02 / 03", 0.1);

      /* Hook */
      tl.fromTo("#h1 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(0));
      tl.fromTo("#h2 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(1));
      tl.to(["#h1 span", "#h2 span"], { yPercent: -105, duration: 0.45, ease: "power3.in", stagger: 0.07 }, b(4) - 0.2);
      tl.set(["#h1", "#h2"], { visibility: "hidden" }, b(4) + 0.4);
      // slow creep while the title holds, so the scene is never static
      tl.to("#world", { y: camY(0) + 900, duration: 2.0, ease: "none" }, 0.2);
      tl.to("#bgw", { y: (camY(0) + 900) * 0.55, duration: 2.0, ease: "none" }, 0.2);

      const F = (k) => b(6 + k * 3);
      for (let k = 0; k < 10; k++) {
        const t = F(k), s = t - 0.7, dur = 0.95;
        tl.to("#world", { y: camY(k), duration: dur, ease: "power3.inOut" }, s);
        tl.to("#bgw", { y: camY(k) * 0.55, duration: dur, ease: "power3.inOut" }, s);
        tl.to(`#bP${k}`, { rotationX: 0, scale: 1, opacity: 1, duration: dur, ease: "power3.out" }, s);
        if (k > 0) tl.to(`#bP${k - 1}`, { rotationX: -24, scale: 0.9, opacity: 0.55, duration: dur, ease: "power3.inOut" }, s);
        drawTo(stopLen[k], s + 0.1, dur + 0.5);
        M.say(FEAT.CAPS[k][0], t - 0.25);
        M.note(FEAT.CAPS[k][1], t - 0.15);
        FEAT.play(tl, "b", k, t + 0.1);
      }

      /* Finale: pull all the way out — the whole road, all ten stops */
      const FIN = F(10);
      const S = 0.16, Y0 = 1000 - S * cy(4.5);
      tl.to("#road", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, FIN - 0.6);
      tl.to("#head", { ...headAt(L), duration: 0.8, ease: "power2.out" }, FIN - 0.6);
      for (let k = 0; k < 10; k++) tl.to(`#bP${k}`, { rotationX: 0, scale: 1, opacity: 1, duration: 1.0, ease: "power3.inOut" }, FIN - 0.6);
      tl.to("#world", { y: Y0, scale: S, transformOrigin: "540px 0px", duration: 1.3, ease: "power3.inOut" }, FIN - 0.6);
      tl.to("#bgw", { opacity: 0, duration: 0.8 }, FIN - 0.6);
      M.say("One card. <i>Ten jobs.</i>", FIN);
      M.note("For every counter in town.", FIN + 0.1);

      M.iris(21.8, (t) => { tl.set(["#view"], { opacity: 0 }, t); M.clear(t - 0.05); tl.set(".tag", { opacity: 0 }, t); });
      M.end(22.2, "ONE CARD · TEN JOBS");

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
