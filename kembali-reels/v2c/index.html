<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit.css" />
    <style>
      /* Reel 02 · C — In hand. One phone, held at the counter, scrolling through
         the ten jobs while the shop behind it changes: café, bakery, salon,
         kopitiam, restaurant. 3D on the way in and the way out. */
      .bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,42,35,0.96) 0%, rgba(10,42,35,0.9) 27%, rgba(10,42,35,0.5) 48%, rgba(10,42,35,0.55) 75%, rgba(10,42,35,0.85) 100%); }
      .mask { position: absolute; left: 70px; width: 940px; text-align: center; overflow: hidden; font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -0.035em; line-height: 1.05; font-size: 170px; height: 190px; }
      .mask span { display: block; }
      .mask i { font-style: italic; font-weight: 400; color: #E0684B; }
      .where { position: absolute; left: 340px; width: 400px; top: 520px; height: 44px; text-align: center; }
      .where span { position: absolute; left: 0; right: 0; top: 0; font-family: "PlexMono", monospace; font-size: 20px; letter-spacing: 0.26em; color: #F6F1E3; }
      #stagec { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 2000px; perspective-origin: 540px 1100px; }
      #phwrap { position: absolute; left: 260px; top: 590px; width: 560px; height: 1172px; transform-style: preserve-3d; }
      #phwrap > .ph { left: 0 !important; top: 0 !important; backface-visibility: hidden; }
      #back { position: absolute; inset: 0; border-radius: 68px; background: #10201A; transform: rotateY(180deg); backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; box-shadow: 0 50px 110px rgba(0,0,0,0.5); }
      #back svg { width: 150px; height: 150px; }
      #back b { font-size: 76px; font-weight: 500; letter-spacing: -0.02em; color: #F6F1E3; }
      #back b i { font-style: normal; color: #E0684B; }
      #stack { position: absolute; left: 16px; top: 84px; width: 358px; }
      .sl { position: relative; width: 358px; height: 314px; margin-bottom: 20px; }
      .sl .fp { transform: scale(0.559); transform-origin: 0 0; box-shadow: 0 8px 20px rgba(22,38,30,0.12); }
      #phwrap .a-hd { position: relative; z-index: 2; background: #F6F1E3; padding-bottom: 12px; }
      .hand { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920">

      <section id="s0" class="clip" data-start="0" data-duration="22.2" data-track-index="1">
        <img class="bg" id="bg0" src="assets/img/ind-cafe.jpg" alt="" />
        <img class="bg" id="bg1" src="assets/img/food-croissant.jpg" alt="" />
        <img class="bg" id="bg2" src="assets/img/ind-salon.jpg" alt="" />
        <img class="bg" id="bg3" src="assets/img/food-coffee.jpg" alt="" />
        <img class="bg" id="bg4" src="assets/img/ind-restaurant.jpg" alt="" />
        <div id="shade"></div>
        <div class="where" id="where"></div>
        <svg class="hand" id="handBack" viewBox="0 0 1080 1920">
          <path d="M395 1920 C 380 1720, 400 1560, 470 1500 C 560 1430, 760 1440, 840 1500 C 900 1545, 910 1720, 890 1920 Z" fill="#B97A55"/>
          <rect x="770" y="1150" width="120" height="84" rx="42" fill="#C98C66" transform="rotate(-8 830 1192)"/>
          <rect x="775" y="1262" width="124" height="86" rx="43" fill="#C98C66" transform="rotate(-4 837 1305)"/>
          <rect x="772" y="1376" width="118" height="84" rx="42" fill="#BF8360" transform="rotate(2 831 1418)"/>
          <rect x="760" y="1486" width="104" height="76" rx="38" fill="#B97A55" transform="rotate(8 812 1524)"/>
        </svg>
        <div id="stagec"><div id="phwrap"><div id="phA"></div><div id="back" data-layout-allow-occlusion><svg viewBox="0 0 80 80"><path d="M64 40 A24 24 0 1 1 57 23" fill="none" stroke="#F6F1E3" stroke-width="6" stroke-linecap="round"/><polygon points="62.7,28.7 60.5,19.5 53.5,26.5" fill="#F6F1E3"/><circle cx="40" cy="40" r="8" fill="#E0684B"/></svg><b>kembal<i>i</i></b></div></div></div>
        <svg class="hand" id="handFront" viewBox="0 0 1080 1920">
          <path d="M300 1920 C 300 1800, 330 1700, 380 1640 C 420 1600, 470 1590, 500 1620 C 520 1680, 480 1760, 470 1920 Z" fill="#C98C66"/>
          <path d="M318 1660 C 290 1590, 262 1480, 262 1400 C 262 1350, 300 1330, 330 1350 C 352 1366, 362 1420, 372 1480 C 385 1560, 410 1620, 420 1660 Z" fill="#D0936D"/>
          <path d="M276 1392 C 272 1362, 296 1344, 318 1356 C 332 1364, 336 1386, 330 1404 C 312 1412, 288 1410, 276 1392 Z" fill="#E6BFA3"/>
          <path d="M340 1480 C 350 1540, 372 1600, 392 1640" fill="none" stroke="#B0744F" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <div class="mask" id="h1" style="top:680px"><span>One <i>card.</i></span></div>
        <div class="mask" id="h2" style="top:870px"><span>Ten jobs.</span></div>
      </section>

      <section id="s9" class="clip" data-start="22.1" data-duration="2.9" data-track-index="4">
        <div id="endc"><svg viewBox="0 0 80 80"><path d="M64 40 A24 24 0 1 1 57 23" fill="none" stroke="#F6F1E3" stroke-width="6" stroke-linecap="round"/><polygon points="62.7,28.7 60.5,19.5 53.5,26.5" fill="#F6F1E3"/><circle cx="40" cy="40" r="8" fill="#E0684B"/></svg><p class="word"><span>k</span><span>e</span><span>m</span><span>b</span><span>a</span><span>l</span><span class="i">i</span></p><p class="tagl">Loyalty your customers will love.</p><p class="line"></p></div>
      </section>

      <section id="ui" class="clip" data-start="0" data-duration="25" data-track-index="3">
        <p class="tag"></p>
        <p class="cap" data-layout-allow-overlap></p><p class="cap" data-layout-allow-overlap></p>
        <p class="sub" data-layout-allow-overlap></p><p class="sub" data-layout-allow-overlap></p>
        <div id="iris"></div>
      </section>

      <audio id="music" data-start="0" data-duration="25" data-track-index="10" data-volume="0.34" data-fade-in="0.3" data-fade-out="1.6" src="assets/music/track.mp3"></audio>
      <audio id="w1" data-start="2.7" data-duration="0.8" data-track-index="11" data-volume="0.5" src="assets/sfx/impact/impactSoft_medium_001.ogg"></audio>
      <audio id="w2" data-start="20.5" data-duration="0.8" data-track-index="12" data-volume="0.5" src="assets/sfx/casino/card-place-1.ogg"></audio>
      <audio id="end" data-start="22.2" data-duration="1.4" data-track-index="13" data-volume="0.55" src="assets/sfx/impact/impactBell_heavy_000.ogg"></audio>
    </div>

    <script src="assets/kit.js"></script>
    <script src="assets/features.js"></script>
    <script>
      const { b, phone, MARK } = K;
      const tl = gsap.timeline({ paused: true });
      const M = K.motion(tl);
      const S = 1.36;

      /* phone: header + a scrolling stack of the ten panels */
      const panels = FEAT.build("c").map((html) => `<div class="sl">${html}</div>`).join("");
      const inner = `<div class="view" data-layout-allow-occlusion><div class="a-hd">${MARK()}<div><b>Corner Coffee</b><small>Mark Avon</small></div><span class="so">Sign out</span></div><div id="stack">${panels}</div></div>`;
      document.getElementById("phA").outerHTML = phone("phA", 0, 0, S, inner);
      FEAT.prep(tl, "c");
      FEAT.allowOverlap("#stack .fp");

      const WHERE = ["AT THE CAFÉ", "AT THE BAKERY", "AT THE SALON", "AT THE KOPITIAM", "AT THE RESTAURANT"];
      const wh = document.getElementById("where");
      WHERE.forEach((w, i) => wh.insertAdjacentHTML("beforeend", `<span id="w${i}">${w}</span>`));

      /* initial states */
      for (let i = 1; i < 5; i++) tl.set(`#bg${i}`, { opacity: 0 }, 0);
      for (let i = 0; i < 5; i++) tl.set(`#w${i}`, { opacity: 0 }, 0);
      tl.set("#phwrap", { opacity: 0, y: 260, rotationY: 70, rotationX: 12 }, 0);
      tl.set([".hand"], { y: 900 }, 0);
      tl.set(["#h1", "#h2"], { visibility: "visible" }, 0);
      tl.set("#stack", { y: 0 }, 0);

      // ken burns on every photo for the whole piece
      for (let i = 0; i < 5; i++) tl.fromTo(`#bg${i}`, { scale: 1.06 }, { scale: 1.2, duration: 22, ease: "none", immediateRender: false }, 0);

      M.tag("KEMBALI · 02 / 03", 0.1);

      /* Hook: the title over the café, then the phone turns in and the hand takes it */
      tl.fromTo("#h1 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(0));
      tl.fromTo("#h2 span", { yPercent: 105 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, b(1));
      tl.to(["#h1 span", "#h2 span"], { yPercent: -105, duration: 0.45, ease: "power3.in", stagger: 0.07 }, b(3) + 0.1);
      tl.set(["#h1", "#h2"], { visibility: "hidden" }, b(4) + 0.2);
      tl.to("#phwrap", { opacity: 1, y: 0, rotationY: 0, rotationX: 0, duration: 1.2, ease: "power3.out" }, b(3) + 0.3);
      tl.to(".hand", { y: 0, duration: 0.8, ease: "power3.out" }, b(5) - 0.2);
      // a slow breathing sway, never still
      tl.to("#phwrap", { rotationZ: 1.2, y: -8, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, b(5) + 0.6);

      const F = (k) => b(6 + k * 3);
      const PITCH = 334 * S; // one panel + gap, in screen px
      for (let k = 0; k < 10; k++) {
        const t = F(k);
        if (k > 0) tl.to("#stack", { y: -334 * k, duration: 0.85, ease: "power3.inOut" }, t - 0.6);
        // shop changes every two jobs
        if (k % 2 === 0) {
          const i = k / 2;
          if (i > 0) { tl.to(`#bg${i}`, { opacity: 1, duration: 0.9, ease: "power1.inOut" }, t - 0.7); tl.to(`#w${i - 1}`, { opacity: 0, y: -8, duration: 0.3 }, t - 0.7); }
          tl.fromTo(`#w${i}`, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, t - 0.3);
          if (i > 0) { tl.to(["#phwrap"], { rotationY: -10, duration: 0.45, ease: "power2.out" }, t - 0.7).to("#phwrap", { rotationY: 0, duration: 0.7, ease: "power2.inOut" }, t - 0.25); }
        }
        M.say(FEAT.CAPS[k][0], t - 0.25);
        M.note(FEAT.CAPS[k][1], t - 0.15);
        FEAT.play(tl, "c", k, t + 0.1);
      }

      /* Finale: the hand lets go, the phone turns round to show whose it is */
      const FIN = F(10);
      M.say("One card. <i>Ten jobs.</i>", FIN - 0.1);
      M.note("For every counter in town.", FIN);
      tl.to(`#w4`, { opacity: 0, duration: 0.3 }, FIN - 0.1);
      tl.to(".hand", { y: 900, duration: 0.6, ease: "power3.in" }, FIN);
      tl.to("#phwrap", { rotationY: 180, rotationZ: 0, y: -30, duration: 1.1, ease: "power3.inOut" }, FIN + 0.35);

      M.iris(21.8, (t) => { tl.set(["#stagec", ".bg", "#shade"], { opacity: 0 }, t); M.clear(t - 0.05); tl.set(".tag", { opacity: 0 }, t); });
      M.end(22.2, "ONE CARD · TEN JOBS");

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
